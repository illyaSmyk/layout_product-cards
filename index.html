<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Product cards</title><link rel=stylesheet href=layout_product-cards.a29ab8ea.css><body>
    <div class=card data-qa=card>
      <img class=card__img src=imac.202c52ff.jpeg alt="imac apple">

      <div class=card__info>
        <h3 class=card__name>
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h3>

        <span class=card__code>Product code: 195434</span>
      </div>

      <div class=card__meta>
        <div class="stars stars--4">
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
        </div>

        <strong class=card__reviews>Reviews: 5</strong>
      </div>

      <div class=card__price>
        <span class=card__price-label>Price:</span>
        <span class=card__price-value>$2199</span>
      </div>

      <a href=# class=card__button data-qa=hover>Buy
      </a>
    
      
    </div>
